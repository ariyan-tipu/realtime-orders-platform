# Production entrypoint: serves the built SPA and proxies API + WebSocket
# traffic to the two backend services on the compose network.
#
# This listens on port 80 only. Putting TLS in front of it (certbot on the
# instance, or an ALB terminating upstream) is a deployment step rather than
# a code one, and it is the same step that sets DJANGO_BEHIND_TLS=1 so the
# core service starts redirecting to HTTPS and issuing secure-only cookies.
# Turning that flag on while this file still listens on 80 alone would send
# every request into a redirect loop out of the stack, which is why the two
# move together. See docs/deployment-aws.md.
#
# Every proxied location forwards X-Forwarded-Proto, so the moment TLS does
# exist the core service sees the original scheme rather than the plain-HTTP
# hop between nginx and gunicorn.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://core:8000;  # whitenoise serves hashed admin assets
    }

    location /healthz {
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this the health check is the one request that looks like
        # plain HTTP once TLS is on, so it would be redirected and every
        # probe would fail against a service that is actually healthy.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://realtime:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
